swagger: '2.0'
info:
  title: Ansible Automation Platform MCP - Job Management
  description: MCP server for managing Ansible Automation Platform jobs and job templates
  version: 1.0.0
host: aap-nostromo.demoredhat.com:8449
basePath: /
schemes:
  - https
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
security:
  - Bearer: []
paths:
  /job_management/mcp:
    post:
      summary: Ansible Automation Platform Job Management Server
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: InvokeMCPJobManagement
      responses:
        '200':
          description: Success
  /inventory_management/mcp:
    post:
      summary: Ansible Automation Platform Inventory Management Server
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: InvokeMCPInventoryManagement
      responses:
        '200':
          description: Success
  /system_monitoring/mcp:
    post:
      summary: Ansible Automation Platform System Monitoring Server
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: InvokeMCPSystemMonitoring
      responses:
        '200':
          description: Success
